<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Blog — Intolerância Zero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chuchubot.css">
</head>
<body data-page="blog">
<header>
  <div class="wrap bar">

    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="Logo Intolerância Zero" class="logo-img">
      Intolerância Zero
    </a>

    <nav id="nav"><a href="index.html">Início</a>
      <a href="catalogo.html">Catálogo</a><a href="blog.html" class="on">Blog</a>
      <a href="entrar.html" id="navLogin">Entrar</a>
    </nav>
    <div class="tools">
      <button class="icon" id="cartBtn" aria-label="Carrinho">🛒<span class="badge" id="count">0</span></button>
      <button class="icon menu-btn" id="menu" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main>
  <div class="page-title">
    <div class="wrap">
      <h1>Blog</h1>
      <p style="margin:0;color:var(--muted)">Dicas, receitas e informação para viver sem intolerâncias.</p>
    </div>
  </div>
  <div class="wrap">
    <div class="grid" id="blogList"></div>
  </div>
</main>

  <footer>
      <div class="wrap">
          <div>
              <h4>Intolerância Zero</h4>
              <p>Alimentação saudável sem restrições.</p>
          </div>
          <div>
              <h4>Navegue</h4>
              <a href="catalogo.html">Catálogo</a><br>
              <a href="blog.html">Blog</a><br>
              <a href="entrar.html">Minha conta</a>
          </div>
          <div>
              <h4>Atendimento</h4>
              <p>contato@intoleranciazero.com.br</p>
              <p>Seg a sex, 9h às 18h</p>
          </div>
      </div>
  </footer>

  <div class="scrim" id="scrim"></div>

  <aside class="drawer" id="drawer">
      <div class="row">
          <h2 style="margin:0">Seu carrinho</h2>
          <button class="icon" id="closeCart" aria-label="Fechar">✕</button>
      </div>
      <div class="list" id="cartList"></div>
      <div class="row" style="margin:14px 0">
          <b>Total</b><b id="total" style="font-size:1.3rem"></b>
      </div>
      <button class="btn" id="checkout" style="justify-content:center">Finalizar compra</button>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chuchubot.js"></script>
</body>
</html>
