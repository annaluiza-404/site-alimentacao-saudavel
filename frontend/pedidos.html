<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Meus pedidos — Intolerância Zero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .pedidos{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:32px auto}
        .pedido{padding:16px;gap:10px}
        .pedido .itens{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
        .st-pendente{background:#fff3d6;color:#8a5a00}
        .st-pago{background:var(--soft);color:var(--brand)}
        .st-enviado{background:#e4eefb;color:#215a9c}
        .st-entregue{background:#dcf5e6;color:#1c6b43}
        .st-cancelado{background:#fbe4e4;color:#a12626}
    </style>
</head>
<body data-page="pedidos">
<header>
  <div class="wrap bar">
    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="Logo Intolerância Zero" class="logo-img">
      Intolerância Zero
    </a>
    <nav id="nav">
      <a href="index.html">Início</a><a href="catalogo.html">Catálogo</a>
      <a href="blog.html">Blog</a><a href="pedidos.html" class="on">Meus pedidos</a><a href="entrar.html" id="navLogin">Entrar</a>
    </nav>
    <div class="tools">
      <button class="icon" id="cartBtn" aria-label="Carrinho">🛒<span class="badge" id="count">0</span></button>
      <button class="icon menu-btn" id="menu" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 style="margin-top:28px">Meus pedidos</h1>
    <div class="pedidos" id="listaPedidos"><div class="empty">Carregando…</div></div>
  </div>
</main>

<footer>
    <div class="wrap">
        <div>
            <h4>Intolerância Zero</h4>
            <p>Alimentação saudável sem restrições.</p>
        </div>
        <div>
            <h4>Navegue</h4>
            <a href="catalogo.html">Catálogo</a><br>
            <a href="blog.html">Blog</a><br>
            <a href="entrar.html">Minha conta</a>
        </div>
        <div>
            <h4>Atendimento</h4>
            <p>contato@intoleranciazero.com.br</p>
            <p>Seg a sex, 9h às 18h</p>
        </div>
    </div>
</footer>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer">
    <div class="row">
        <h2 style="margin:0">Seu carrinho</h2>
        <button class="icon" id="closeCart" aria-label="Fechar">✕</button>
    </div>
    <div class="list" id="cartList"></div>
    <div class="row" style="margin:14px 0">
        <b>Total</b><b id="total" style="font-size:1.3rem"></b>
    </div>
    <button class="btn" id="checkout" style="justify-content:center">Finalizar compra</button>
</aside>
<div class="toast" id="toast"></div>

<script src="js/env.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
